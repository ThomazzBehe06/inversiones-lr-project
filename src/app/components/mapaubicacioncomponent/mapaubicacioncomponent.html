<div class="mapa-contenedor">
  <div #mapa class="mapa" role="region" [attr.aria-label]="'Mapa con la ubicación de ' + titulo()"></div>
</div>

<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-2">
  @if (direccion()) {
    <span class="text-muted"><i class="bi bi-geo-alt-fill"></i> {{ direccion() }}</span>
  }
  <a class="btn btn-outline-primary btn-sm" [href]="enlaceMapa" target="_blank" rel="noopener noreferrer">
    <i class="bi bi-box-arrow-up-right"></i> Abrir en OpenStreetMap
  </a>
</div>
