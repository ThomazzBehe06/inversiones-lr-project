<nav class="navbar navbar-expand-lg navbar-dark navbar-lr sticky-top">
  <div class="container-xl">

    <a class="navbar-brand" routerLink="/inicio" (click)="cerrarMenu()">
      <img src="assets/images/logo-lr-claro.png" alt="Inversiones LR - Inicio">
    </a>

    <button class="navbar-toggler" type="button" (click)="alternarMenu()">
      <i class="bi bi-list"></i>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAbierto">

      <ul class="navbar-nav mx-auto gap-lg-5">
        <li class="nav-item">
          <a class="nav-link" routerLink="/inicio" routerLinkActive="active" (click)="cerrarMenu()">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/alojamientos" routerLinkActive="active" (click)="cerrarMenu()">Alojamientos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/reservas" routerLinkActive="active" (click)="cerrarMenu()">Reservas</a>
        </li>
      </ul>

      <div class="buscador">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control" placeholder="Buscar" #texto
               (keyup.enter)="buscar(texto.value)">
      </div>

      <div class="moneda">
        @if (menuMoneda) {
          <div class="fondo-menu" (click)="cerrarMenuMoneda()"></div>
        }

        <button type="button" class="moneda-boton" (click)="alternarMenuMoneda()">
          <i class="bi bi-globe2"></i>
          <span>{{ monedaService.monedaActual().codigo }}</span>
          <i class="bi bi-chevron-down flecha"></i>
        </button>

        @if (menuMoneda) {
          <div class="moneda-menu">
            <p class="moneda-titulo">Elige tu moneda</p>

            <button type="button" class="moneda-opcion"
                    *ngFor="let m of monedaService.monedas; trackBy: porCodigo"
                    [class.activa]="m.codigo === monedaService.monedaActual().codigo"
                    (click)="elegirMoneda(m.codigo)">
              <strong>{{ m.codigo }}</strong>
              <span>{{ m.nombre }}</span>
            </button>

            @if (monedaService.usandoRespaldo) {
              <p class="moneda-aviso">Tasas aproximadas.</p>
            }
          </div>
        }
      </div>

    </div>
  </div>
</nav>
