<main class="login-fondo">
  <div class="login-tarjeta">
    <img src="assets/images/logo-lr.png" alt="Inversiones LR" class="login-logo">

    @if (vista === 'entrar') {
      <h1 class="h4 mb-3">Inicia sesión</h1>

      <form (ngSubmit)="iniciarSesion()">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" [(ngModel)]="correo" name="correo" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="contrasena" name="contrasena" required>
        </div>

        @if (mensajeError) {
          <p class="text-danger small mb-3">{{ mensajeError }}</p>
        }

        <button type="submit" class="btn btn-lr w-100 mb-3">Entrar</button>
      </form>

      <p class="text-center text-muted small mb-0">
        ¿No tienes cuenta?
        <button type="button" class="btn btn-link btn-sm p-0 align-baseline" (click)="cambiarVista('registro')">Regístrate</button>
      </p>
    } @else {
      <h1 class="h4 mb-3">Crea tu cuenta</h1>

      <form (ngSubmit)="crearCuenta()">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" [(ngModel)]="correo" name="correo" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="contrasena" name="contrasena" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="confirmarContrasena" name="confirmarContrasena" required>
        </div>

        @if (mensajeError) {
          <p class="text-danger small mb-3">{{ mensajeError }}</p>
        }

        <button type="submit" class="btn btn-lr w-100 mb-3">Crear cuenta</button>
      </form>

      <p class="text-center text-muted small mb-0">
        ¿Ya tienes cuenta?
        <button type="button" class="btn btn-link btn-sm p-0 align-baseline" (click)="cambiarVista('entrar')">Inicia sesión</button>
      </p>
    }
  </div>
</main>
